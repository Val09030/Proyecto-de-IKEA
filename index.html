<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKEA — Muebles y decoración</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ikea-blue: #0058A3;
    --ikea-yellow: #FFD600;
    --ikea-blue-dark: #004f93;
    --bg: #f5f4f0;
    --surface: #ffffff;
    --text: #111111;
    --text-muted: #6b6b6b;
    --border: #e0ddd8;
    --nav-h: 52px;
  }

  body {
    font-family: 'Noto Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }

  /* ── Navbar ── */
  .navbar {
    height: var(--nav-h);
    background: var(--ikea-blue);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 28px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }

  .nav-logo {
    background: var(--ikea-yellow);
    color: var(--ikea-blue);
    font-weight: 700;
    font-size: 20px;
    padding: 3px 10px;
    border-radius: 3px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .nav-links { display: flex; gap: 4px; flex: 1; }

  .nav-link {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 4px;
    transition: background .15s, color .15s;
  }
  .nav-link:hover { background: rgba(255,255,255,0.12); color: #fff; }

  .nav-right { font-size: 12px; color: rgba(255,255,255,0.7); }

  /* ── Page body ── */
  .page-body {
    display: flex;
    height: calc(100vh - var(--nav-h));
    margin-top: var(--nav-h);
  }

  /* ── Filter sidebar ── */
  .filter-panel {
    width: 210px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 16px;
  }

  .filter-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .filter-group { margin-bottom: 20px; }
  .filter-group-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .filter-option input { cursor: pointer; accent-color: var(--ikea-blue); }
  .filter-option span:first-of-type { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-count { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }

  .price-range { width: 100%; accent-color: var(--ikea-blue); }
  .price-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ── Catalog area ── */
  .catalog-area { flex: 1; overflow-y: auto; padding: 20px; }

  .catalog-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .catalog-heading { font-size: 18px; font-weight: 600; }
  .catalog-count { font-size: 13px; color: var(--text-muted); }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 14px;
  }

  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: box-shadow .2s;
    cursor: pointer;
  }
  .product-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); }

  .product-img-wrap { width: 100%; aspect-ratio: 4/3; overflow: hidden; background: var(--bg); }
  .product-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .product-img-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: var(--border);
  }

  .product-info { padding: 10px 12px 12px; }
  .product-cat { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .product-name { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .product-price { font-size: 14px; font-weight: 700; color: var(--ikea-blue); margin-bottom: 8px; }
  .product-btn {
    display: inline-block; text-decoration: none;
    font-size: 12px; font-family: inherit;
    padding: 5px 12px;
    background: var(--ikea-blue); color: #fff;
    border: none; border-radius: 4px;
    cursor: pointer; transition: background .15s;
  }
  .product-btn:hover { background: var(--ikea-blue-dark); }

  .no-results { grid-column: 1/-1; text-align: center; padding: 48px; color: var(--text-muted); font-size: 14px; }

  /* ── Bot panel ── */
  .bot-panel {
    width: 340px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .bot-header {
    background: var(--ikea-blue);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .bot-logo { background: var(--ikea-yellow); color: var(--ikea-blue); font-weight: 700; font-size: 13px; padding: 2px 7px; border-radius: 3px; }
  .bot-header-info { flex: 1; }
  .bot-header-title { color: #fff; font-size: 13.5px; font-weight: 600; }
  .bot-header-sub { color: rgba(255,255,255,0.65); font-size: 11px; }
  .status-dot { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; }

  .bot-messages {
    flex: 1; overflow-y: auto;
    padding: 14px 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .bot-messages::-webkit-scrollbar { width: 3px; }
  .bot-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-row { display: flex; align-items: flex-end; gap: 6px; animation: fadeUp .2s ease; }
  .msg-row.user { flex-direction: row-reverse; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--ikea-yellow);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: var(--ikea-blue);
    flex-shrink: 0;
  }

  .bubble {
    max-width: 82%; padding: 8px 12px; border-radius: 14px;
    font-size: 13px; line-height: 1.5;
  }
  .msg-row.bot .bubble {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-bottom-left-radius: 3px;
  }
  .msg-row.user .bubble {
    background: var(--ikea-blue); color: #fff; border-bottom-right-radius: 3px;
  }

  /* Recommendation cards in bot */
  .rec-cards { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .rec-card { display: block; text-decoration: none; color: inherit; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); transition: box-shadow .15s; }
  a.rec-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.12); }
  .rec-img { width: 100%; height: 110px; object-fit: cover; display: block; background: var(--bg); }
  .rec-body { padding: 8px 10px; }
  .rec-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .rec-name { font-weight: 600; font-size: 12.5px; color: var(--text); }
  .rec-price { font-weight: 700; font-size: 12px; color: var(--ikea-blue); white-space: nowrap; }
  .rec-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 12px 8px; flex-shrink: 0; }
  .chip {
    background: #fff; border: 1px solid var(--ikea-blue); color: var(--ikea-blue);
    border-radius: 18px; padding: 4px 11px; font-size: 11.5px; font-family: inherit;
    cursor: pointer; transition: all .15s;
  }
  .chip:hover { background: var(--ikea-blue); color: #fff; }

  /* Typing indicator */
  .typing { display: flex; align-items: center; gap: 3px; padding: 8px 12px; }
  .typing span {
    width: 5px; height: 5px; background: var(--text-muted); border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
  }

  /* Input area */
  .input-area {
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center; flex-shrink: 0;
  }
  .input-box {
    flex: 1; border: 1.5px solid var(--border); border-radius: 20px;
    padding: 8px 14px; font-family: inherit; font-size: 13px;
    color: var(--text); background: var(--bg); outline: none; transition: border-color .15s;
  }
  .input-box:focus { border-color: var(--ikea-blue); }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--bg);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 15px; transition: border-color .15s, background .15s; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--ikea-blue); background: #fff; }

  .send-btn {
    width: 36px; height: 36px; background: var(--ikea-blue);
    border: none; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s; flex-shrink: 0;
  }
  .send-btn:hover { background: var(--ikea-blue-dark); }
  .send-btn svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .bot-welcome { text-align: center; padding: 20px 12px 8px; color: var(--text-muted); }
  .bot-welcome-icon { font-size: 28px; margin-bottom: 6px; }
  .bot-welcome h3 { font-size: 13.5px; color: var(--text); margin-bottom: 4px; }
  .bot-welcome p { font-size: 12px; line-height: 1.5; }

  /* Markdown inside bot bubbles */
  .bubble strong { font-weight: 700; }
  .bubble em { font-style: italic; }
  .bubble code { background: rgba(0,0,0,0.06); border-radius: 4px; padding: 1px 4px; font-size: 12px; }
  .bubble ul { margin: 4px 0 0 16px; padding: 0; }
  .bubble li { margin-bottom: 2px; }

  /* User-uploaded photo thumbnail in chat */
  .bubble .user-photo {
    display: block; max-width: 180px; width: 100%; border-radius: 10px;
    margin-bottom: 2px;
  }
  .msg-row.user .bubble:has(.user-photo) { padding: 4px; background: var(--ikea-blue); }

  /* Loading skeletons for the product grid */
  .skeleton-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .skeleton-card .sk { background: linear-gradient(90deg, #eee 25%, #f5f5f5 37%, #eee 63%); background-size: 400% 100%; animation: shimmer 1.4s infinite; }
  .skeleton-card .sk-img { aspect-ratio: 4/3; }
  .skeleton-card .sk-line { height: 11px; margin: 8px 12px; border-radius: 3px; }
  .skeleton-card .sk-line.short { width: 55%; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  /* Responsive: tighten or stack panels on narrow viewports */
  @media (max-width: 1100px) {
    .filter-panel { width: 180px; }
    .bot-panel { width: 300px; }
  }
  @media (max-width: 860px) {
    .filter-panel { display: none; }
    .bot-panel { width: 280px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">IKEA</div>
  <div class="nav-links">
    <a class="nav-link" href="#">Sofás</a>
    <a class="nav-link" href="#">Almacenamiento</a>
    <a class="nav-link" href="#">Mesas</a>
    <a class="nav-link" href="#">Iluminación</a>
    <a class="nav-link" href="#">Dormitorio</a>
    <a class="nav-link" href="#">Cocina</a>
  </div>
  <div class="nav-right">IKEA México</div>
</nav>

<div class="page-body">

  <aside class="filter-panel">
    <div class="filter-title">Filtros</div>
    <div class="filter-group">
      <div class="filter-group-name">Categoría</div>
      <div id="cat-filters"></div>
    </div>
    <div class="filter-group">
      <div class="filter-group-name">Precio máximo</div>
      <input type="range" class="price-range" id="price-range" min="0" max="20000" step="500" value="20000" oninput="onPriceChange(this.value)">
      <div class="price-label" id="price-label">Hasta $20,000 MXN</div>
    </div>
  </aside>

  <main class="catalog-area">
    <div class="catalog-header">
      <div class="catalog-heading">Todos los productos</div>
      <div class="catalog-count" id="catalog-count">Cargando…</div>
    </div>
    <div class="product-grid" id="product-grid"></div>
  </main>

  <aside class="bot-panel">
    <div class="bot-header">
      <div class="bot-logo">IKEA</div>
      <div class="bot-header-info">
        <div class="bot-header-title">AI Companion</div>
        <div class="bot-header-sub">Asistente virtual</div>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="bot-messages" id="bot-messages">
      <div class="bot-welcome">
        <div class="bot-welcome-icon">🛋️</div>
        <h3>Hola, soy tu asistente IKEA</h3>
        <p>Sube una foto de tu espacio o pregúntame qué mueble buscas.</p>
      </div>
    </div>

    <div class="chips" id="chips">
      <button class="chip" onclick="sendChip(this)">Busco un sofá</button>
      <button class="chip" onclick="sendChip(this)">Necesito almacenamiento</button>
      <button class="chip" onclick="sendChip(this)">¿Qué me recomiendas?</button>
    </div>

    <div class="input-area">
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="uploadPhoto(this)">
      <button class="icon-btn" onclick="document.getElementById('photoInput').click()" title="Subir foto de tu espacio">📷</button>
      <input class="input-box" id="chat-input" type="text" placeholder="Escribe tu mensaje…" autocomplete="off">
      <button class="send-btn" onclick="sendMessage()" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </aside>
</div>

<script>
const gridEl     = document.getElementById('product-grid');
const countEl    = document.getElementById('catalog-count');
const catFilEl   = document.getElementById('cat-filters');
const priceEl    = document.getElementById('price-range');
const priceLblEl = document.getElementById('price-label');
const messagesEl = document.getElementById('bot-messages');
const inputEl    = document.getElementById('chat-input');
const chipsEl    = document.getElementById('chips');

let allProducts      = [];
let activeCategories = new Set();
let maxPrice         = 20000;
let historial        = [];

// ── Catalog ──────────────────────────────────────────────

function showSkeletons(n = 9) {
  gridEl.innerHTML = Array.from({ length: n }).map(() => `
    <div class="skeleton-card">
      <div class="sk sk-img"></div>
      <div class="sk sk-line"></div>
      <div class="sk sk-line short"></div>
    </div>`).join('');
}

function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

async function loadCatalog() {
  countEl.textContent = 'Cargando…';
  showSkeletons();
  try {
    const res = await fetch('http://localhost:5000/catalog');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allProducts = await res.json();

    // Solo categorías reales (no vacías/nulas) y con al menos 1 producto, con su conteo.
    const counts = {};
    allProducts.forEach(p => {
      const c = (p.categoria || '').trim();
      if (!c || c.toLowerCase() === 'nan' || c.toLowerCase() === 'none') return;
      counts[c] = (counts[c] || 0) + 1;
    });

    catFilEl.innerHTML = '';
    Object.keys(counts).sort((a, b) => counts[b] - counts[a]).forEach(cat => {
      activeCategories.add(cat);
      const label = document.createElement('label');
      label.className = 'filter-option';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = true;
      input.dataset.cat = cat;
      input.onchange = function () { toggleCat(this.dataset.cat, this.checked); };
      label.appendChild(input);
      label.insertAdjacentHTML('beforeend',
        ` <span title="${escapeAttr(cat)}">${cat}</span> <span class="cat-count">(${counts[cat]})</span>`);
      catFilEl.appendChild(label);
    });

    const maxCat = Math.max(...allProducts.map(p => p.precio_mxn));
    priceEl.max   = maxCat;
    priceEl.value = maxCat;
    maxPrice = maxCat;
    priceLblEl.textContent = `Hasta $${maxCat.toLocaleString('es-MX')} MXN`;

    renderGrid(allProducts);
  } catch (e) {
    countEl.textContent = '';
    gridEl.innerHTML = '<div class="no-results">No se pudo cargar el catálogo.<br>¿Está corriendo <code>server.py</code> en el puerto 5000?</div>';
  }
}

function renderGrid(products) {
  countEl.textContent = `${products.length} productos`;
  if (!products.length) {
    gridEl.innerHTML = '<div class="no-results">Sin resultados para los filtros seleccionados.</div>';
    return;
  }
  gridEl.innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-img-wrap">
        ${p.image_url
          ? `<img class="product-img" src="${p.image_url}" alt="${escapeHtml(p.nombre)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'product-img-placeholder\\'>🛋️</div>'">`
          : '<div class="product-img-placeholder">🛋️</div>'}
      </div>
      <div class="product-info">
        <div class="product-cat">${escapeHtml(p.categoria)}</div>
        <div class="product-name">${escapeHtml(p.nombre)}</div>
        <div class="product-price">$${p.precio_mxn.toLocaleString('es-MX')} MXN</div>
        ${p.product_url
          ? `<a class="product-btn" href="${p.product_url}" target="_blank" rel="noopener">Ver más</a>`
          : `<button class="product-btn">Ver más</button>`}
      </div>
    </div>`).join('');
}

function applyFilters() {
  renderGrid(allProducts.filter(p => activeCategories.has(p.categoria) && p.precio_mxn <= maxPrice));
}

function toggleCat(cat, checked) {
  checked ? activeCategories.add(cat) : activeCategories.delete(cat);
  applyFilters();
}

function onPriceChange(val) {
  maxPrice = Number(val);
  priceLblEl.textContent = `Hasta $${Number(val).toLocaleString('es-MX')} MXN`;
  applyFilters();
}

// ── Chat ─────────────────────────────────────────────────

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function sendChip(btn) { inputEl.value = btn.textContent; sendMessage(); }

// Escapa HTML para evitar inyección antes de aplicar el mini-markdown.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Mini-parser de markdown: negritas, cursivas, `code`, viñetas y saltos de línea.
function renderMarkdown(text) {
  const lines = escapeHtml(text).split('\n');
  let html = '', inList = false;
  for (let line of lines) {
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    if (bullet) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${bullet[1]}</li>`;
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    html += line + '<br>';
  }
  if (inList) html += '</ul>';
  return html
    .replace(/<br>$/, '')
    .replace(/<br>(<ul>)/g, '$1')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

// role: 'bot' | 'user'. html=true inserta markup ya construido (p. ej. la miniatura).
function addMessage(role, content, { html = false } = {}) {
  messagesEl.querySelector('.bot-welcome')?.remove();
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'bot' ? 'AI' : 'Tú';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (html)               bubble.innerHTML = content;
  else if (role === 'bot') bubble.innerHTML = renderMarkdown(content);
  else                     bubble.textContent = content;
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typing-row';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() { document.getElementById('typing-row')?.remove(); }

function addRecommendations(recs) {
  messagesEl.querySelector('.bot-welcome')?.remove();
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = `<div class="rec-cards">${recs.map(p => {
    const inner = `
      ${p.image_url ? `<img class="rec-img" src="${p.image_url}" alt="${escapeHtml(p.nombre)}" onerror="this.style.display='none'">` : ''}
      <div class="rec-body">
        <div class="rec-top">
          <span class="rec-name">${escapeHtml(p.nombre)}</span>
          <span class="rec-price">$${p.precio_mxn.toLocaleString('es-MX')} MXN</span>
        </div>
        <div class="rec-desc">${escapeHtml(p.descripcion)}</div>
      </div>`;
    return p.product_url
      ? `<a class="rec-card" href="${p.product_url}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="rec-card">${inner}</div>`;
  }).join('')}</div>`;
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadPhoto(el) {
  const file = el.files[0];
  if (!file) return;
  el.value = '';
  chipsEl.innerHTML = '';

  // Mostramos la miniatura de la foto del usuario en su propia burbuja.
  try {
    const dataUrl = await readFileAsDataURL(file);
    addMessage('user', `<img class="user-photo" src="${dataUrl}" alt="Foto de mi espacio">`, { html: true });
  } catch {
    addMessage('user', '📷 (foto de mi espacio)');
  }

  showTyping();
  try {
    const fd = new FormData();
    fd.append('foto', file);
    const res  = await fetch('http://localhost:5000/analizar-foto', { method: 'POST', body: fd });
    const data = await res.json();
    removeTyping();
    if (data.room_profile) {
      addMessage('bot', data.mensaje);
      historial.push({ role: 'assistant', content: data.mensaje });
      addRecommendations(data.recomendaciones || []);
      chipsEl.innerHTML = `
        <button class="chip" onclick="sendChip(this)">¿Cuál me recomiendas?</button>
        <button class="chip" onclick="sendChip(this)">Ver más opciones</button>`;
    } else {
      addMessage('bot', '⚠️ No pude analizar la foto: ' + (data.error || 'error desconocido'));
    }
  } catch {
    removeTyping();
    addMessage('bot', '⚠️ No se pudo conectar con el servidor.');
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  chipsEl.innerHTML = '';
  inputEl.value = '';
  addMessage('user', text);
  historial.push({ role: 'user', content: text });
  showTyping();
  try {
    const res  = await fetch('http://localhost:5000/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ historial })
    });
    const data = await res.json();
    removeTyping();
    if (data.respuesta) {
      addMessage('bot', data.respuesta);
      historial.push({ role: 'assistant', content: data.respuesta });
      chipsEl.innerHTML = `
        <button class="chip" onclick="sendChip(this)">Ver más opciones</button>
        <button class="chip" onclick="sendChip(this)">¿Cuánto cuesta?</button>`;
    } else {
      addMessage('bot', 'Hubo un error. Revisa que el servidor esté corriendo.');
    }
  } catch {
    removeTyping();
    addMessage('bot', '⚠️ No se pudo conectar con el servidor.');
  }
}

loadCatalog();
